<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/styles.css" />
    <title>Mi To-Do List</title>
  </head>

  <body>
    <h1>Mi TO-DO list</h1>
    <br>
    <hr>
    <br>

    <section>
    <button id="nueva-tarea">Nueva Tarea</button>
    </section>

    <br>

    <h2>Mis Tareas</h2>

    <br>

    <section id="lista-tareas"></section>

    <article class="bloque-tarea">
      <p class="nombre-tarea"></p>
      <p class="fecha-tarea"><b>Para: </b> <span class="fecha"></span></p>
      <button class="tarea-completada">Completada</button>
      <button class="tarea-eliminada">Eliminar</button>
    </article>

    <br>

    <article id="bloque-crear-tarea">
        <h4 label for="input-nombre">Nombre</h4>
        <input 
          type="text" 
          id="input-nombre" 
          placeholder="Nombre de la tarea" 
        />

        <h4 label for="input-fecha">Fecha de entrega</h4>
        <input 
          type="date"  
          id="input-fecha" 
          name="fecha" 
        />

        <br>
        <button id="tarea-creada">Crear</button>
        <button id="cancelar">Cancelar</button>
    </article>

    <script src="scripts/script.js"></script>
  </body>
</html>
